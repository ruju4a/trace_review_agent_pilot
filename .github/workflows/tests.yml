name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m src.run_experiment --dry-run --out outputs/ci.jsonl
      - run: python -m src.generate_experiments --cases data/demo_cases.jsonl --out outputs/ci-experiments
